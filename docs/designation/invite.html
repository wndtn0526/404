    <script>
        document.addEventListener('input', (e) => {
            const mask = e.target.dataset?.mask;
            if (mask !== 'date' && mask !== 'rrn') return;

            const atEnd = e.target.selectionStart === e.target.value.length;
            const d = e.target.value.replace(/[^0-9]/g, '');
            const cut = mask === 'date' ? [4, 6, 8] : [6, 13];

            let out = d.slice(0, cut[0]);
            for (let i = 1; i < cut.length; i++) {
                if (d.length > cut[i - 1]) out += '-' + d.slice(cut[i - 1], cut[i]);
            }
            if (out === e.target.value) return;

            e.target.value = out;
            // 끝에서 치던 중이면 커서를 끝에 둔다(안 그러면 하이픈이 붙을 때마다 앞으로 튄다)
            if (atEnd) e.target.setSelectionRange(out.length, out.length);
        });
    </script>
