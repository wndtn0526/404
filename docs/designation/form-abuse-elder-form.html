            <style>

           1.3 → 1.2 → 1.25로 맞췄다(2026-08-21) — 12px→15 · 14px→17.5 · 컨트롤 24px→30. */
        --bo-type: 1.25;
    }

    /* ── 셸(LNB·GNB·상단바)은 배율에서 뺀다 (요청 2026-08-21) ───────────────
       메뉴는 「어디로 갈까」를 훑는 곳이라 원래 크기가 읽기 좋고, 240px LNB에서 글자가 커지면
       2급 메뉴 이름이 줄바꿈된다. 아래 규칙이 calc(Npx * var(--bo-type))이므로
       **여기서 변수만 1로 되돌리면** 셸 안쪽 전부가 원래 크기로 계산된다(규칙을 두 벌 적지 않는다). */
    .bo-shell { --bo-type: 1; }

    /* ── DS 타이포 토큰 ×배율 ─────────────────────────────────────────────── */
    .text-display-1 { font-size: calc(56px * var(--bo-type)); }
    .text-display-2 { font-size: calc(40px * var(--bo-type)); }
    .text-display-3 { font-size: calc(36px * var(--bo-type)); }
    .text-title-1 { font-size: calc(32px * var(--bo-type)); }
    .text-title-2 { font-size: calc(30px * var(--bo-type)); }
    .text-title-3 { font-size: calc(24px * var(--bo-type)); }
    .text-heading-1 { font-size: calc(22px * var(--bo-type)); }
    .text-heading-2 { font-size: calc(20px * var(--bo-type)); }
    .text-headline-1 { font-size: calc(19px * var(--bo-type)); }
    .text-headline-2 { font-size: calc(18px * var(--bo-type)); }
    .text-body-1, .text-body-1-reading { font-size: calc(16px * var(--bo-type)); }
    .text-body-2, .text-body-2-reading { font-size: calc(15px * var(--bo-type)); }
    .text-label-1, .text-label-1-reading { font-size: calc(14px * var(--bo-type)); }
    .text-label-2 { font-size: calc(13px * var(--bo-type)); }
    .text-caption-1 { font-size: calc(12px * var(--bo-type)); }
    .text-caption-2 { font-size: calc(11px * var(--bo-type)); }

    /* 반응형 변형 — 백오피스에서 실제로 쓰는 세 가지만 덮는다.
       (덮지 않으면 위 기본 규칙이 더 나중에 와서 넓은 화면에서 크기가 안 바뀐다) */
    @media (min-width: 640px) {

    }
    @media (min-width: 1024px) {
        .lg\:text-title-2 { font-size: calc(30px * var(--bo-type)); }
        .lg\:text-heading-1 { font-size: calc(22px * var(--bo-type)); }
    }

    /* ── DS 배지(x-badge) 박스 ×배율 ─────────────────────────────────────────
       글자만 1.25배가 되고 패딩·라운드·아이콘은 px 그대로라 배지가 DS 원본보다 납작해 보였다(요청 2026-09-04).
       x-badge 루트의 ds-badge--{size} 마커에 사이즈표(components/badge.blade.php $sizes)와 **같은 값**을 배율로 다시 적는다.
       특이도는 유틸리티(px-2 …)와 같아 순서로 이긴다 — 위 토큰 규칙과 같은 원리. 값을 바꾸면 badge.blade.php 사이즈표와 함께 바꿀 것. */
    .ds-badge--xs { padding: calc(3px * var(--bo-type)) calc(6px * var(--bo-type)); border-radius: calc(6px * var(--bo-type)); gap: calc(2px * var(--bo-type)); }
    .ds-badge--sm { padding: calc(4px * var(--bo-type)) calc(6px * var(--bo-type)); border-radius: calc(6px * var(--bo-type)); gap: calc(3px * var(--bo-type)); }
    .ds-badge--md { padding: calc(5px * var(--bo-type)) calc(8px * var(--bo-type)); border-radius: calc(8px * var(--bo-type)); gap: calc(4px * var(--bo-type)); }
    .ds-badge--lg { padding: calc(6px * var(--bo-type)) calc(8px * var(--bo-type)); border-radius: calc(8px * var(--bo-type)); gap: calc(4px * var(--bo-type)); }

    /* ── EMR 스킨의 컨트롤 ─────────────────────────────────────────────────
       글자만 키우면 24px 칸에 15px 글자가 들어가 잘린다(줄높이 1.5 = 22.5px).

    <div x-data="{
        raf: null,
        palette: [],
        /** DS 토큰 클래스가 붙은 숨은 span에서 실제 색을 읽어온다(토큰이 바뀌면 자동 반영) */
        readPalette() {
            if (this.palette.length) return this.palette;
            this.palette = [...this.$refs.swatches.children].map((el) => getComputedStyle(el).backgroundColor);
            return this.palette;
        },
        start(opt = {}) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const canvas = this.$refs.canvas;
            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = window.innerWidth, H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const colors = this.readPalette();
            const count = opt.count ?? 140;
            const duration = opt.duration ?? 1800;
            const rand = (a, b) => a + Math.random() * (b - a);

            // 화면 중앙에서 360° 바깥쪽으로 터진다(원형 버스트) — 각도를 균등 분배하고 살짝 흔들어 뭉침 방지
            const ox = W / 2, oy = H / 2;
            const bits = Array.from({ length: count }, (_, i) => {
                const angle = (Math.PI * 2 * i) / count + rand(-0.08, 0.08);
                const speed = rand(9, 21);
                return {
                    x: ox, y: oy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    w: rand(6, 11), h: rand(8, 15),
                    rot: rand(0, Math.PI * 2), vr: rand(-0.22, 0.22),
                    color: colors[i % colors.length],
                };
            });

            const t0 = performance.now();
            const tick = (now) => {
                const t = now - t0;
                if (t > duration) { ctx.clearRect(0, 0, W, H); this.raf = null; return; }
                const fade = t > duration * 0.65 ? 1 - (t - duration * 0.65) / (duration * 0.35) : 1;
                ctx.clearRect(0, 0, W, H);
                ctx.globalAlpha = Math.max(fade, 0);
                for (const b of bits) {
                    b.vy += 0.22;            // 중력 — 중앙 버스트는 바깥으로 퍼지는 궤적이 먼저 읽히도록 약하게
                    b.vx *= 0.988;           // 공기 저항
                    b.vy *= 0.994;
                    b.x += b.vx; b.y += b.vy; b.rot += b.vr;
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.rot);
                    ctx.fillStyle = b.color;
                    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
                    ctx.restore();
                }
                ctx.globalAlpha = 1;
                this.raf = requestAnimationFrame(tick);
            };
            cancelAnimationFrame(this.raf);
            this.raf = requestAnimationFrame(tick);
        },

    <script>
        document.addEventListener('input', (e) => {
            const mask = e.target.dataset?.mask;
            if (mask !== 'date' && mask !== 'rrn') return;

            const atEnd = e.target.selectionStart === e.target.value.length;
            const d = e.target.value.replace(/[^0-9]/g, '');
            const cut = mask === 'date' ? [4, 6, 8] : [6, 13];

            let out = d.slice(0, cut[0]);
            for (let i = 1; i < cut.length; i++) {
                if (d.length > cut[i - 1]) out += '-' + d.slice(cut[i - 1], cut[i]);
            }
            if (out === e.target.value) return;

            e.target.value = out;
            // 끝에서 치던 중이면 커서를 끝에 둔다(안 그러면 하이픈이 붙을 때마다 앞으로 튄다)
            if (atEnd) e.target.setSelectionRange(out.length, out.length);
        });
    </script>
